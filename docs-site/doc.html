<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="page-title">Mediabase Docs</title>
<style>
  :root {
    --paper-050: #15161a;
    --paper-100: #1c1e24;
    --ink-950: #f1ede2;
    --ink-800: #cfc9b8;
    --ink-600: #96907e;
    --line: rgba(241, 237, 226, 0.14);
    --ember-600: #e8a54f;
    --ember-500: #dd9640;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper-050);
    color: var(--ink-800);
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.65;
  }
  main { max-width: 760px; margin: 0 auto; padding: 2.5rem 1.4rem 6rem; }
  .back {
    display: inline-block;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.8rem;
    color: var(--ember-500);
    text-decoration: none;
    margin-bottom: 2rem;
  }
  #content h1, #content h2, #content h3 {
    font-family: Iowan Old Style, "Palatino Linotype", Palatino, Georgia, serif;
    color: var(--ink-950);
    text-wrap: balance;
    font-weight: 600;
  }
  #content h1 { font-size: 1.9rem; border-bottom: 1px solid var(--line); padding-bottom: 0.8rem; }
  #content h2 { font-size: 1.35rem; margin-top: 2.2rem; }
  #content h3 { font-size: 1.05rem; margin-top: 1.6rem; }
  #content p, #content li { max-width: 74ch; }
  #content ul, #content ol { padding-left: 1.3rem; }
  #content li { margin-bottom: 0.4rem; }
  #content strong { color: var(--ink-950); }
  #content code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.87em;
    background: var(--paper-100);
    padding: 0.1em 0.4em;
    border-radius: 3px;
  }
  #content pre {
    background: var(--paper-100);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 1rem;
    overflow-x: auto;
  }
  #content pre code { background: none; padding: 0; }
  #content table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin: 1rem 0; }
  #content th, #content td { text-align: left; padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--line); }
  #content th {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-600);
  }
  #content a { color: var(--ember-500); }
  #content hr { border: none; border-top: 1px solid var(--line); margin: 2rem 0; }
  .state { color: var(--ink-600); font-family: ui-monospace, monospace; font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <a class="back" href="/">&larr; all docs</a>
  <div id="content"><p class="state">Loading…</p></div>
</main>
<script src="vendor/marked.min.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const src = params.get("src");
  const content = document.getElementById("content");

  if (!src) {
    content.innerHTML = '<p class="state">No document specified.</p>';
  } else {
    fetch(src)
      .then((r) => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then((md) => {
        content.innerHTML = marked.parse(md);
        const h1 = content.querySelector("h1");
        if (h1) document.getElementById("page-title").textContent = h1.textContent + " — Mediabase Docs";
      })
      .catch((err) => {
        content.innerHTML = '<p class="state">Could not load ' + src + " (" + err.message + ")</p>";
      });
  }
</script>
</body>
</html>
